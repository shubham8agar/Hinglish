name: Upstream localization task
description: Propose and claim one small, source-specific localization task
title: "localization: "
body:
  - type: markdown
    attributes:
      value: Use this issue for internal coordination after a Hinglish support request is triaged; it is not the issue in the target project. The default first contribution is the target's primary README translated into Hinglish, with a PR asking to add/list Hinglish support. Search the target for overlapping issues/PRs first. The target task issue must be assigned to one active contributor before drafting begins; any additional maintainer approval is also required. Verify content reuse rights, but do not translate license text or notices. This proposal does not claim Hinglish is standardized or already accepted.
  - type: input
    id: repository
    attributes:
      label: Upstream repository
      description: Link the exact project repository.
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: input
    id: source-url
    attributes:
      label: Exact source URL
      description: Link the specific page, file, or translation unit.
      placeholder: https://
    validations:
      required: true
  - type: input
    id: source-revision
    attributes:
      label: Source revision
      description: Record a commit, version, or last-updated date so concurrent work uses the same source.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Prefer the primary README as the demonstration scope. Record the exact page/sections and note if project limits require a smaller sample.
    validations:
      required: true
  - type: textarea
    id: locale-policy
    attributes:
      label: Current Hinglish policy/status
      description: Link the current policy or state that Hinglish is not listed/its status is unclear. Prior acceptance is not required for a sample PR that proposes support; do not imply acceptance.
    validations:
      required: true
  - type: input
    id: contribution-channel
    attributes:
      label: Required contribution channel
      description: For example, a translation platform, locale repository, or pull request process.
    validations:
      required: true
  - type: textarea
    id: rights
    attributes:
      label: README content reuse rights
      description: Identify the license that permits adapting this exact README content and link its terms. A repository's code license may not cover documentation. Do not translate the license text or notices.
    validations:
      required: true
  - type: dropdown
    id: domain-risk
    attributes:
      label: Domain and review risk
      description: Identify the domain and any qualified review needed.
      options:
        - General or education
        - Technology or software
        - Finance
        - Law or public policy
        - Health or safety
        - Other or high-impact
    validations:
      required: true
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Duplicate-work check
      options:
        - label: I searched existing issues and pull requests for this repository and exact source unit.
          required: true